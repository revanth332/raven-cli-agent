[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "my-cli-agent"
version = "0.1.0"
description = "A sleek CLI agent built with Typer"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv",
    "google-genai",
    "playwright",
    "questionary",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "chromadb"
]

[project.scripts]
raven = "agent.main:app"